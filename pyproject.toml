[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karst"
version = "0.2.10"
description = "Code context for AI dev tools — graph-grounded, pack-scoped retrieval over MCP. 60% fewer tokens, audit-grade citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Moin Latif", email = "moinlatif105@gmail.com" }]
maintainers = [{ name = "Moin Latif", email = "moinlatif105@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "code-search", "rag", "graphrag",
    "tree-sitter", "code-intelligence", "ai", "llm", "cursor", "claude",
    "embeddings", "code-review", "impact-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upper bounds keep a fresh `pip install karst` from pulling a future major
# (or, for 0.x packages, minor) release that nobody has tested. The weekly
# install-smoke workflow tells us when a bound is ready to move.
dependencies = [
    # 0.26.0 segfaults / corrupts node data mid-walk on real repos (seen on
    # Windows + Python 3.13); 0.25.x is clean.
    "tree-sitter>=0.25.2,<0.26",
    # 0.13.x is the last line that ships every grammar inside the wheel. 1.x
    # downloads each grammar on first use, which breaks air-gapped installs and
    # the "no runtime network" claim in docs/compliance. Don't lift this cap
    # without a pre-seeding story (see karst/parser.py).
    "tree-sitter-language-pack>=0.13.0,<1",
    "pathspec>=0.12,<2",
    "fastembed>=0.4,<0.9",
    "qdrant-client>=1.12,<2",
    "unidiff>=0.7.5,<2",
    "networkx>=3.2,<4",
    # mcp 2.x removed `mcp.server.fastmcp` (renamed to MCPServer), which
    # breaks `karst-mcp` at import time.
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/Moin105/karst"
Repository = "https://github.com/Moin105/karst"
Issues = "https://github.com/Moin105/karst/issues"
Changelog = "https://github.com/Moin105/karst/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.50"]
llm = ["anthropic>=0.39", "openai>=1.50"]
dev = [
    "pytest>=8",
]

[project.scripts]
karst = "karst.cli:main"
karst-mcp = "karst.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["karst*"]
