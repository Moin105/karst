name: CI

# Runs the test suite on every push/PR, plus a real-embedder end-to-end smoke
# (index -> ask) so integration bugs like the embedder batch-size OOM get caught
# automatically.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + integration tests (fast, no model)
        run: pytest -q

      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/karst-model
          key: karst-fastembed-bge-small-en-v1.5-v1

      - name: End-to-end smoke (real embedder)
        env:
          KARST_E2E: "1"
          KARST_TEST_MODEL_CACHE: ~/.cache/karst-model
        run: pytest -q tests/test_e2e_smoke.py
