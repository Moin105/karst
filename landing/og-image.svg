<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Editable source for og-image.png (1200x630). Re-render the PNG after edits. -->
  <rect width="1200" height="630" fill="#0A0A0F"/>

  <!-- faint strata along the bottom edge -->
  <g fill="#CCA57A" opacity="0.07">
    <rect x="0" y="588" width="1200" height="8"/>
    <rect x="180" y="604" width="1020" height="8"/>
    <rect x="0" y="620" width="1200" height="10"/>
  </g>

  <!-- lockup -->
  <g transform="translate(58 46) scale(2.2)">
    <rect x="8" y="11" width="32" height="6" rx="1" fill="#CCA57A"/>
    <rect x="16" y="21" width="24" height="6" rx="1" fill="#B9895C"/>
    <rect x="8" y="31" width="32" height="6" rx="1" fill="#8F6840"/>
    <circle cx="10.5" cy="24" r="3.2" fill="#34D399"/>
  </g>
  <text x="166" y="118" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="44" font-weight="500" fill="#F8FAFC">karst</text>

  <!-- headline + sub -->
  <g font-family="Inter, system-ui, sans-serif" fill="#F8FAFC">
    <text x="72" y="262" font-size="66" font-weight="600" letter-spacing="-1.5">Know what your</text>
    <text x="72" y="340" font-size="66" font-weight="600" letter-spacing="-1.5">change breaks.</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="25" fill="#94A3B8">
    <text x="72" y="412">Private code intelligence for AI agents.</text>
    <text x="72" y="448">Cited answers + blast radius. 100% local.</text>
  </g>

  <!-- footer -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20">
    <text x="72" y="548" fill="#CCA57A">pip install karst</text>
    <text x="300" y="548" fill="#4B5563">·</text>
    <text x="324" y="548" fill="#94A3B8">Apache-2.0</text>
    <text x="460" y="548" fill="#4B5563">·</text>
    <text x="484" y="548" fill="#94A3B8">github.com/Moin105/karst</text>
  </g>

  <!-- terminal card: real `karst impact` output -->
  <g transform="translate(700 176)">
    <rect width="428" height="300" rx="12" fill="#13131C" stroke="#1F2937" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="#2A2A35"/>
    <circle cx="42" cy="24" r="5" fill="#2A2A35"/>
    <circle cx="60" cy="24" r="5" fill="#2A2A35"/>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17">
      <text x="24" y="74"><tspan fill="#34D399">$</tspan><tspan fill="#E5E7EB"> karst impact --target get_user</tspan></text>
      <text x="24" y="112" fill="#E5E7EB" xml:space="preserve">Affected: 5   Risk: <tspan fill="#CCA57A">MEDIUM</tspan></text>
      <text x="24" y="160" fill="#E5E7EB">auth.py::login</text>
      <text x="404" y="160" fill="#6B7280" text-anchor="end">auth.py:6-10</text>
      <text x="24" y="194" fill="#E5E7EB">billing.py::charge</text>
      <text x="404" y="194" fill="#6B7280" text-anchor="end">billing.py:6-10</text>
      <text x="24" y="228" fill="#9CA3AF">users.py</text>
      <text x="404" y="228" fill="#6B7280" text-anchor="end">contains</text>
      <text x="24" y="262" fill="#9CA3AF">auth.py, billing.py</text>
      <text x="404" y="262" fill="#6B7280" text-anchor="end">imports</text>
    </g>
  </g>
</svg>
